
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.scene { border-radius: 16px; overflow: hidden; position: relative; height: 360px; background: #05050f; }
canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.photo-layer {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background-image: url('/mnt/user-data/uploads/IMG_0988.jpeg');
  background-size: cover; background-position: center;
  opacity: 0; transition: none;
  border-radius: 16px;
}
.overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.55) 100%);
  opacity: 0; transition: none;
  border-radius: 16px;
}
.content { position: absolute; bottom: 2rem; left: 1.5rem; z-index: 20; opacity: 0; transform: translateY(12px); }
.label { font-size: 11px; color: rgba(255,230,180,0.75); letter-spacing: 0.15em; margin-bottom: 8px; }
.title { font-size: 20px; font-weight: 500; color: rgba(255,248,230,0.97); line-height: 1.5; margin-bottom: 10px; text-shadow: 0 1px 12px rgba(0,0,0,0.5); }
.sub { font-size: 12px; color: rgba(255,220,170,0.8); }
.replay-btn { position: absolute; top: 1rem; right: 1rem; z-index: 30; font-size: 11px; color: rgba(255,230,180,0.6); background: rgba(0,0,0,0.3); border: 0.5px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
</style>

<div style="padding: 1rem 0;">
<div class="scene" id="scene">
  <canvas id="sky"></canvas>
  <div class="photo-layer" id="photoLayer"></div>
  <div class="overlay" id="overlay"></div>
  <div class="content" id="content">
    <div class="label">Frontend Engineer</div>
    <div class="title">何度も夜明けを見た。<br>その積み重ねが、<br>今の自分をつくっている。</div>
    <div class="sub">WordPress / PHP / Astro</div>
  </div>
  <div class="replay-btn" id="replayBtn">もう一度</div>
</div>
</div>

<script>
(function() {
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const scene = document.getElementById('scene');
  const content = document.getElementById('content');
  const photoLayer = document.getElementById('photoLayer');
  const overlay = document.getElementById('overlay');
  const replayBtn = document.getElementById('replayBtn');

  function resize() { canvas.width = scene.offsetWidth; canvas.height = scene.offsetHeight; }
  resize();

  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }
  function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }
  function easeCubic(t) { return t*t*(3-2*t); }

  const stars = [];
  function initStars() {
    stars.length = 0;
    const w = canvas.width, h = canvas.height;
    for (let i = 0; i < 130; i++) {
      stars.push({ x: Math.random()*w, y: Math.random()*h*0.65, r: Math.random()*1.2+0.3, twinkle: Math.random()*Math.PI*2, speed: Math.random()*0.04+0.02 });
    }
  }

  let progress = 0, animId = null, contentShown = false;

  const skyStops = [
    { t: 0,   stops: [{pos:0,c:[2,2,12]},{pos:0.3,c:[5,5,20]},{pos:0.6,c:[8,5,18]},{pos:1,c:[10,6,15]}] },
    { t: 0.4, stops: [{pos:0,c:[5,8,30]},{pos:0.3,c:[15,15,50]},{pos:0.6,c:[40,20,30]},{pos:1,c:[60,30,20]}] },
    { t: 0.7, stops: [{pos:0,c:[20,20,60]},{pos:0.25,c:[60,30,40]},{pos:0.55,c:[160,80,40]},{pos:0.75,c:[200,120,60]},{pos:1,c:[160,90,60]}] },
  ];

  function getSkyGrad(p) {
    let a = skyStops[0], b = skyStops[skyStops.length-1];
    for (let i = 0; i < skyStops.length-1; i++) {
      if (p >= skyStops[i].t && p <= skyStops[i+1].t) { a = skyStops[i]; b = skyStops[i+1]; break; }
    }
    const t = a.t === b.t ? 0 : (p - a.t) / (b.t - a.t);
    const mx = Math.max(a.stops.length, b.stops.length);
    return Array.from({length: mx}, (_, i) => {
      const ai = Math.min(i, a.stops.length-1), bi = Math.min(i, b.stops.length-1);
      return { pos: lerp(a.stops[ai].pos, b.stops[bi].pos, t), c: a.stops[ai].c.map((v,j) => Math.round(lerp(v, b.stops[bi].c[j], t))) };
    });
  }

  function drawSky(p) {
    const w = canvas.width, h = canvas.height;
    const g = ctx.createLinearGradient(0, 0, 0, h);
    getSkyGrad(Math.min(p, 0.7)).forEach(s => g.addColorStop(s.pos, `rgb(${s.c.join(',')})`));
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }

  function drawStars(p) {
    const op = clamp(1 - p / 0.45, 0, 1);
    if (op <= 0) return;
    stars.forEach(s => {
      s.twinkle += s.speed;
      const tw = Math.sin(s.twinkle) * 0.3 + 0.7;
      const o = op * tw;
      if (s.r > 0.9) {
        const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r*5);
        g.addColorStop(0, `rgba(200,210,255,${o*0.35})`);
        g.addColorStop(1, `rgba(200,210,255,0)`);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, s.r*5, 0, Math.PI*2); ctx.fill();
      }
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${o})`; ctx.fill();
    });
  }

  function drawEarlyGlow(p) {
    const w = canvas.width, h = canvas.height;
    const op = clamp((p - 0.25) / 0.3, 0, 1);
    if (op <= 0) return;
    const sunX = w * 0.45, sunY = h * 0.72;
    const g = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, w * 0.5);
    g.addColorStop(0, `rgba(200,100,40,${op * 0.35})`);
    g.addColorStop(0.4, `rgba(160,70,30,${op * 0.15})`);
    g.addColorStop(1, `rgba(100,40,20,0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }

  function updatePhotoLayer(p) {
    const fadeStart = 0.55;
    const fadeEnd = 0.82;
    const photoOp = clamp((p - fadeStart) / (fadeEnd - fadeStart), 0, 1);
    const smoothOp = easeCubic(photoOp);
    photoLayer.style.opacity = smoothOp;
    overlay.style.opacity = smoothOp;
  }

  function showContent(p) {
    if (p > 0.78 && !contentShown) {
      contentShown = true;
      content.style.transition = 'opacity 1.8s ease, transform 1.8s ease';
      content.style.opacity = '1'; content.style.transform = 'translateY(0)';
    }
  }

  function draw(p) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawSky(p);
    drawStars(p);
    drawEarlyGlow(p);
    updatePhotoLayer(p);
  }

  function animate() {
    progress += 0.0025;
    if (progress >= 1) { progress = 1; draw(progress); showContent(progress); return; }
    draw(easeInOut(progress));
    showContent(progress);
    animId = requestAnimationFrame(animate);
  }

  function reset() {
    if (animId) cancelAnimationFrame(animId);
    progress = 0; contentShown = false;
    content.style.transition = 'none';
    content.style.opacity = '0'; content.style.transform = 'translateY(12px)';
    photoLayer.style.opacity = '0'; overlay.style.opacity = '0';
    initStars(); setTimeout(() => animate(), 100);
  }

  replayBtn.addEventListener('click', reset);
  initStars(); animate();
})();
</script>
